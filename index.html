<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی ترکیب‌ها</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(180deg, #a8edea 0%, #fed6e3 50%, #ffd3a5 100%);
    min-height: 100vh; overflow: hidden;
  }
  .cloud {
    position: fixed; font-size: 3em; opacity: 0.8; pointer-events: none; z-index: 1;
    animation: cloudMove linear infinite;
  }
  @keyframes cloudMove { 0%{transform:translateX(-100px)} 100%{transform:translateX(110vw)} }
  .rainbow-bg {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: repeating-linear-gradient(45deg,
      rgba(255,182,193,0.15) 0px, rgba(255,182,193,0.15) 40px,
      rgba(173,216,230,0.15) 40px, rgba(173,216,230,0.15) 80px,
      rgba(255,255,153,0.15) 80px, rgba(255,255,153,0.15) 120px);
    z-index:0; pointer-events:none;
  }

  /* تصاویر زمینه ثابت */
  .bg-deco {
    position: fixed; pointer-events: none; z-index: 1; font-size: 3.5em;
    opacity: 0.55; animation: bgSway 4s ease-in-out infinite;
  }
  @keyframes bgSway { 0%,100%{transform:rotate(-8deg) scale(1)} 50%{transform:rotate(8deg) scale(1.08)} }
  .bg-bird {
    position: fixed; pointer-events: none; z-index: 1; font-size: 2.2em;
    opacity: 0.6; animation: birdFly 12s linear infinite;
  }
  @keyframes birdFly {
    0%{transform:translateX(-80px) translateY(0)} 50%{transform:translateX(40vw) translateY(-30px)}
    100%{transform:translateX(105vw) translateY(10px)}
  }

  #startScreen {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; color:white; text-align:center; padding:20px; position:relative; z-index:5;
  }
  #startScreen h1 {
    font-size:2.8em; margin-bottom:20px; text-shadow:3px 3px 0 #ff6b9d,-1px -1px 0 #fff;
    -webkit-text-stroke:1px #ff6b9d; color:#fff; animation:bounce 1.5s ease-in-out infinite;
  }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  #designerName {
    font-size:1.3em; margin-bottom:30px; font-weight:bold;
    background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3,#54a0ff);
    background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    animation:colorShift 3s ease infinite;
  }
  @keyframes colorShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  #nameInput {
    padding:14px 20px; font-size:1.2em; border:4px solid #ff9ff3; border-radius:30px;
    margin-bottom:20px; text-align:center; width:260px; outline:none;
    font-family:inherit; box-shadow:0 4px 10px rgba(0,0,0,0.15);
  }
  #startBtn {
    padding:16px 40px; font-size:1.3em; background:linear-gradient(45deg,#ff9a56,#ff6b9d);
    color:white; border:4px solid white; border-radius:30px; cursor:pointer;
    box-shadow:0 6px 15px rgba(0,0,0,0.25); transition:transform 0.2s;
    font-family:inherit; font-weight:bold;
  }
  #startBtn:hover { transform:scale(1.08) rotate(-2deg); }

  #gameScreen { display:none; position:relative; width:100vw; height:100vh; overflow:hidden; z-index:5; }

  #hud {
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(255,255,255,0.4); backdrop-filter:blur(10px);
    padding:10px 20px; display:flex; justify-content:space-between; align-items:center;
    color:#6c3483; font-size:0.95em; flex-wrap:wrap; gap:5px;
    border-bottom:4px dashed #ff9ff3;
  }
  .hud-item { background:rgba(255,255,255,0.6); padding:6px 14px; border-radius:20px; font-weight:bold; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
  #timerDisplay { color:#ff6b35; }
  #timerDisplay.urgent { color:#ff4757; animation:pulse 0.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  #taskBox {
    position:fixed; top:70px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.95); border-radius:25px; padding:15px 25px;
    text-align:center; z-index:99; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    min-width:280px; border:3px solid #ffd166;
  }
  #taskType { font-size:1.5em; font-weight:bold; color:#ff6b9d; }
  #taskInstruction { font-size:0.95em; color:#6c5ce7; margin-top:5px; }

  #garden { position:absolute; top:0; left:0; width:100%; height:100%; z-index:2; }

  .flower {
    position:absolute; cursor:pointer; text-align:center;
    transition:transform 0.1s; user-select:none;
    display:flex; flex-direction:column; align-items:center; width:90px;
  }
  .flower:hover { transform:scale(1.15); }
  .flower-emoji { font-size:2.4em; animation:sway 3s ease-in-out infinite; filter:drop-shadow(1px 2px 2px rgba(0,0,0,0.2)); }
  .flower-word {
    background:rgba(255,255,255,0.95); border-radius:12px;
    padding:4px 9px; font-size:0.8em; font-weight:bold;
    color:#2d3436; margin-top:2px; white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,0.15); border:2px solid #ffe0f0;
  }
  @keyframes sway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }

  .butterfly {
    position:absolute; font-size:1.8em; pointer-events:none;
    animation:flutter 4s ease-in-out infinite; z-index:3;
  }
  @keyframes flutter {
    0%{transform:translate(0,0) rotate(0deg)} 25%{transform:translate(30px,-20px) rotate(10deg)}
    50%{transform:translate(60px,10px) rotate(-5deg)} 75%{transform:translate(20px,30px) rotate(8deg)}
    100%{transform:translate(0,0) rotate(0deg)}
  }

  /* زنبور خوشگل با SVG */
  #bee {
    position:absolute; width:60px; height:60px; cursor:grab; z-index:50;
    filter:drop-shadow(2px 3px 4px rgba(0,0,0,0.3));
    transition:left 0.45s ease, top 0.45s ease;
  }
  #bee.flying { animation:beeFly 5s ease-in-out infinite; transition:none; }
  #bee:active { cursor:grabbing; }
  @keyframes beeFly {
    0%,100%{transform:translate(0,0) rotate(0deg)}
    25%{transform:translate(18px,-14px) rotate(8deg)}
    50%{transform:translate(-8px,12px) rotate(-5deg)}
    75%{transform:translate(12px,-6px) rotate(4deg)}
  }

  #feedback {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:2em; font-weight:bold; z-index:200; pointer-events:none;
    text-align:center; padding:20px 30px; border-radius:20px;
    display:none; animation:feedbackAnim 0.5s ease;
  }
  .feedback-correct { background:rgba(0,200,100,0.9); color:white; }
  .feedback-wrong { background:rgba(255,60,60,0.9); color:white; }
  @keyframes feedbackAnim {
    0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}
  }

  #endScreen {
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(180deg,#a8edea,#fed6e3,#ffd3a5); z-index:300;
    flex-direction:column; align-items:center; justify-content:center;
    color:#6c3483; text-align:center; padding:20px;
  }
  #endScreen h2 { font-size:2.5em; margin-bottom:15px; }
  #finalScore { font-size:3em; font-weight:bold; color:#ff6b35; margin:10px 0; }
  #endStats { font-size:1.1em; margin:10px 0 25px; }
  #restartBtn {
    padding:14px 35px; font-size:1.2em; background:linear-gradient(45deg,#ff9a56,#ff6b9d);
    color:white; border:4px solid white; border-radius:25px; cursor:pointer;
    font-family:inherit; box-shadow:0 4px 15px rgba(0,0,0,0.2); font-weight:bold;
  }
  #confettiCanvas { position:fixed; top:0; left:0; pointer-events:none; z-index:299; }
</style>
</head>
<body>

<div class="rainbow-bg"></div>

<!-- Start Screen -->
<div id="startScreen">
  <h1>🌸🐝 بازی ترکیب‌ها 🐝🌸</h1>
  <div id="designerName">طراح: زینب چعباوی</div>
  <input type="text" id="nameInput" placeholder="نام خود را وارد کنید" />
  <button id="startBtn" onclick="startGame()">بزن بریم بازی! 🚀</button>
</div>

<!-- Game Screen -->
<div id="gameScreen">
  <div id="hud">
    <div class="hud-item">👤 <span id="playerName"></span></div>
    <div class="hud-item" id="timerDisplay">⏱ <span id="timerVal">60</span></div>
    <div class="hud-item">⭐ <span id="scoreVal">0</span></div>
    <div class="hud-item">✅ <span id="correctVal">0</span> | ❌ <span id="wrongVal">0</span></div>
  </div>
  <div id="taskBox">
    <div id="taskType"></div>
    <div id="taskInstruction"></div>
  </div>
  <div id="garden"></div>

  <!-- زنبور SVG خوشگل -->
  <svg id="bee" class="flying" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <!-- بدن -->
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="#FFD700" stroke="#E6A800" stroke-width="1.5"/>
    <!-- راه‌راه‌های بدن -->
    <ellipse cx="40" cy="46" rx="18" ry="13" fill="none" stroke="#333" stroke-width="0" />
    <rect x="24" y="40" width="32" height="5" rx="3" fill="#333" opacity="0.35"/>
    <rect x="24" y="49" width="32" height="5" rx="3" fill="#333" opacity="0.35"/>
    <!-- سر -->
    <circle cx="40" cy="30" r="11" fill="#FFD700" stroke="#E6A800" stroke-width="1.5"/>
    <!-- چشم‌ها -->
    <circle cx="36" cy="28" r="3.5" fill="white"/>
    <circle cx="44" cy="28" r="3.5" fill="white"/>
    <circle cx="37" cy="28.5" r="2" fill="#222"/>
    <circle cx="45" cy="28.5" r="2" fill="#222"/>
    <circle cx="37.8" cy="27.5" r="0.7" fill="white"/>
    <circle cx="45.8" cy="27.5" r="0.7" fill="white"/>
    <!-- لبخند -->
    <path d="M36 33 Q40 37 44 33" stroke="#c0392b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- شاخک‌ها -->
    <line x1="36" y1="20" x2="30" y2="12" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="44" y1="20" x2="50" y2="12" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="30" cy="11" r="2" fill="#ff6b9d"/>
    <circle cx="50" cy="11" r="2" fill="#ff6b9d"/>
    <!-- بال‌ها -->
    <ellipse cx="22" cy="36" rx="13" ry="7" fill="rgba(173,216,255,0.75)" stroke="#aad4ff" stroke-width="1"/>
    <ellipse cx="58" cy="36" rx="13" ry="7" fill="rgba(173,216,255,0.75)" stroke="#aad4ff" stroke-width="1"/>
    <ellipse cx="20" cy="44" rx="9" ry="5" fill="rgba(200,230,255,0.6)" stroke="#aad4ff" stroke-width="1"/>
    <ellipse cx="60" cy="44" rx="9" ry="5" fill="rgba(200,230,255,0.6)" stroke="#aad4ff" stroke-width="1"/>
    <!-- نیش -->
    <polygon points="40,59 37,65 43,65" fill="#E6A800"/>
  </svg>

  <div id="feedback"></div>
</div>

<!-- End Screen -->
<div id="endScreen">
  <h2 id="endTitle">🎉 آفرین! بازی تمام شد! 🎉</h2>
  <div id="finalScore"></div>
  <div id="endStats"></div>
  <button id="restartBtn" onclick="restartGame()">🔄 دوباره بازی کن</button>
</div>

<canvas id="confettiCanvas"></canvas>

<script>
const FLOWERS = ['🌸','🌺','🌻','🌹','🌷','💐','🌼','🏵️'];

const WORDS = {
  vasfi: [
    {word:'گل سرخ',correct:true},{word:'آب زلال',correct:true},{word:'شب تاریک',correct:true},
    {word:'دل شاد',correct:true},{word:'کوه بلند',correct:true},{word:'باد سرد',correct:true},
    {word:'آسمان آبی',correct:true},{word:'دریای آرام',correct:true},{word:'ستاره درخشان',correct:true},
    {word:'برگ سبز',correct:true},{word:'خانه پدری',correct:false},{word:'کتاب دانش',correct:false},
    {word:'دست معلم',correct:false},{word:'چشم مادر',correct:false},{word:'صدای باران',correct:false},
    {word:'نور خورشید',correct:false},{word:'رنگ بهار',correct:false},{word:'عطر گل',correct:false},
    {word:'پرواز پرنده',correct:false},{word:'خنده کودک',correct:false},
  ],
  ezafi: [
    {word:'خانه پدر',correct:true},{word:'کتاب دانش',correct:true},{word:'دست معلم',correct:true},
    {word:'چشم مادر',correct:true},{word:'صدای باران',correct:true},{word:'نور خورشید',correct:true},
    {word:'رنگ بهار',correct:true},{word:'عطر گل',correct:true},{word:'پرواز پرنده',correct:true},
    {word:'خنده کودک',correct:true},{word:'گل سرخ',correct:false},{word:'آب زلال',correct:false},
    {word:'شب تاریک',correct:false},{word:'دل شاد',correct:false},{word:'کوه بلند',correct:false},
    {word:'باد سرد',correct:false},{word:'آسمان آبی',correct:false},{word:'دریای آرام',correct:false},
    {word:'ستاره درخشان',correct:false},{word:'برگ سبز',correct:false},
  ]
};

const CORRECT_MSGS = ['آفرین! 🌟','عالی! 🎉','تو بهترینی! 💪','فوق‌العاده! ✨','احسنت! 🏆'];
const WRONG_MSGS = ['دوباره سعی کن! 💙','اشتباه! تلاش کن 🔄','نگران نباش، ادامه بده! 😊'];

let score=0, correct=0, wrong=0, timer=60, currentType='vasfi';
let timerInterval, typeInterval, beeX=200, beeY=200, isDragging=false;
let playerName='';

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  if(type==='correct') {
    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659, audioCtx.currentTime+0.1);
    osc.frequency.setValueAtTime(784, audioCtx.currentTime+0.2);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.5);
    osc.start(); osc.stop(audioCtx.currentTime+0.5);
  } else {
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.setValueAtTime(200, audioCtx.currentTime+0.15);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.4);
    osc.start(); osc.stop(audioCtx.currentTime+0.4);
  }
}

// صدای دست زدن واقعی
function playApplause() {
  const duration = 3.5;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0; i<bufferSize; i++) {
    // شبیه‌سازی صدای دست زدن با نویز ضربدر پالس‌های تصادفی
    const clap = Math.random() < 0.003 ? (Math.random()*2-1)*0.9 : 0;
    data[i] = clap * Math.exp(-((i % (audioCtx.sampleRate*0.18)) / (audioCtx.sampleRate*0.04)));
  }
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(1.5, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
  source.connect(gain); gain.connect(audioCtx.destination);
  source.start();
}

// صدای تبریک (ملودی شاد)
function playCheer() {
  const notes = [523,587,659,698,784,880,988,1046,1175,1319];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    const t = audioCtx.currentTime + i*0.13;
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.4);
    osc.start(t); osc.stop(t+0.4);
  });
}

function getGridPositions(count) {
  const positions = [];
  const cols=5, rows=6;
  const startX=5, startY=140;
  const cellW=(window.innerWidth-100)/cols;
  const cellH=(window.innerHeight-200)/rows;
  for(let r=0; r<rows && positions.length<count; r++)
    for(let c=0; c<cols && positions.length<count; c++)
      positions.push({x: startX+c*cellW+(cellW-90)/2, y: startY+r*cellH});
  return positions;
}

function renderFlowers() {
  const garden = document.getElementById('garden');
  garden.querySelectorAll('.flower').forEach(f=>f.remove());
  const shuffled = [...WORDS[currentType]].sort(()=>Math.random()-0.5).slice(0,20);
  const positions = getGridPositions(shuffled.length);
  shuffled.forEach((item,i) => {
    const div = document.createElement('div');
    div.className = 'flower';
    div.style.left = positions[i].x+'px';
    div.style.top = positions[i].y+'px';
    div.innerHTML = `<div class="flower-emoji" style="animation-delay:${i*0.15}s">${FLOWERS[i%FLOWERS.length]}</div><div class="flower-word">${item.word}</div>`;
    div.addEventListener('click', ()=>onFlowerClick(div, item.correct));
    garden.appendChild(div);
  });
}

function moveBeeToFlower(el) {
  const bee = document.getElementById('bee');
  const rect = el.getBoundingClientRect();
  bee.classList.remove('flying');
  bee.style.left = (rect.left+rect.width/2-30)+'px';
  bee.style.top = (rect.top-20)+'px';
  clearTimeout(bee._flyTimeout);
  bee._flyTimeout = setTimeout(()=>bee.classList.add('flying'), 1200);
}

function onFlowerClick(el, isCorrect) {
  if(audioCtx.state==='suspended') audioCtx.resume();
  moveBeeToFlower(el);
  if(isCorrect) {
    score+=10; correct++;
    playSound('correct');
    showFeedback(CORRECT_MSGS[Math.floor(Math.random()*CORRECT_MSGS.length)], true);
    el.style.transition='transform 0.3s'; el.style.transform='scale(0)';
    setTimeout(()=>el.remove(), 300);
  } else {
    score-=10; wrong++;
    playSound('wrong');
    showFeedback(WRONG_MSGS[Math.floor(Math.random()*WRONG_MSGS.length)], false);
    el.style.background='rgba(255,100,100,0.3)';
    setTimeout(()=>el.style.background='', 500);
  }
  updateHUD();
}

function showFeedback(msg, isCorrect) {
  const fb = document.getElementById('feedback');
  fb.textContent = msg;
  fb.className = isCorrect ? 'feedback-correct' : 'feedback-wrong';
  fb.style.display = 'block';
  clearTimeout(fb._timeout);
  fb._timeout = setTimeout(()=>fb.style.display='none', 1500);
}

function updateHUD() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('correctVal').textContent = correct;
  document.getElementById('wrongVal').textContent = wrong;
}

function updateTaskBox() {
  const isVasfi = currentType==='vasfi';
  document.getElementById('taskType').textContent = isVasfi ? '🌸 ترکیب وصفی' : '🔗 ترکیب اضافی';
  document.getElementById('taskInstruction').textContent = isVasfi
    ? 'گل‌هایی که ترکیب وصفی دارند را بچین!'
    : 'گل‌هایی که ترکیب اضافی دارند را بچین!';
}

function addButterflies() {
  const garden = document.getElementById('garden');
  ['🦋','🦋','🦋'].forEach((b,i)=>{
    const el = document.createElement('div');
    el.className='butterfly'; el.textContent=b;
    el.style.left=(Math.random()*80+5)+'%';
    el.style.top=(Math.random()*60+10)+'%';
    el.style.animationDelay=(i*1.5)+'s';
    el.style.animationDuration=(3+Math.random()*3)+'s';
    garden.appendChild(el);
  });
}

function addClouds() {
  ['☁️','⛅','☁️'].forEach((c,i)=>{
    const el=document.createElement('div'); el.className='cloud'; el.textContent=c;
    el.style.top=(10+i*15)+'vh';
    el.style.animationDuration=(25+i*10)+'s';
    el.style.animationDelay=(i*5)+'s';
    document.body.appendChild(el);
  });
}

function addBgDecorations() {
  // گل‌های زمینه ثابت
  const bgFlowers = [
    {emoji:'🌻', bottom:'5%', right:'3%', delay:'0s', dur:'3.5s'},
    {emoji:'🌹', bottom:'8%', left:'2%', delay:'1s', dur:'4s'},
    {emoji:'🌷', bottom:'3%', right:'18%', delay:'0.5s', dur:'3s'},
    {emoji:'🌸', bottom:'12%', left:'15%', delay:'1.5s', dur:'4.5s'},
    {emoji:'🌺', top:'15%', right:'2%', delay:'0.8s', dur:'3.8s'},
    {emoji:'🌼', top:'20%', left:'1%', delay:'0.3s', dur:'4.2s'},
  ];
  bgFlowers.forEach(f=>{
    const el=document.createElement('div'); el.className='bg-deco'; el.textContent=f.emoji;
    if(f.bottom) el.style.bottom=f.bottom;
    if(f.top) el.style.top=f.top;
    if(f.right) el.style.right=f.right;
    if(f.left) el.style.left=f.left;
    el.style.animationDelay=f.delay;
    el.style.animationDuration=f.dur;
    document.body.appendChild(el);
  });
  // بلبل‌های متحرک
  ['🐦','🐦'].forEach((b,i)=>{
    const el=document.createElement('div'); el.className='bg-bird'; el.textContent=b;
    el.style.top=(15+i*25)+'%';
    el.style.animationDelay=(i*6)+'s';
    el.style.animationDuration=(10+i*4)+'s';
    document.body.appendChild(el);
  });
}

function setupBee() {
  const bee = document.getElementById('bee');
  bee.style.left=beeX+'px'; bee.style.top=beeY+'px';
  bee.addEventListener('mousedown', e=>{isDragging=true; bee.classList.remove('flying'); e.preventDefault();});
  bee.addEventListener('touchstart', e=>{isDragging=true; bee.classList.remove('flying'); e.preventDefault();},{passive:false});
  document.addEventListener('mousemove', e=>{
    if(!isDragging) return;
    beeX=e.clientX-30; beeY=e.clientY-30;
    bee.style.left=beeX+'px'; bee.style.top=beeY+'px';
  });
  document.addEventListener('touchmove', e=>{
    if(!isDragging) return;
    beeX=e.touches[0].clientX-30; beeY=e.touches[0].clientY-30;
    bee.style.left=beeX+'px'; bee.style.top=beeY+'px';
  },{passive:false});
  document.addEventListener('mouseup', ()=>isDragging=false);
  document.addEventListener('touchend', ()=>isDragging=false);
}

function startGame() {
  const name = document.getElementById('nameInput').value.trim() || 'بازیکن';
  playerName = name;
  document.getElementById('playerName').textContent = name;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';

  score=0; correct=0; wrong=0; timer=60; currentType='vasfi';
  updateHUD(); updateTaskBox(); renderFlowers(); addButterflies(); setupBee();

  timerInterval = setInterval(()=>{
    timer--;
    document.getElementById('timerVal').textContent = timer;
    const td = document.getElementById('timerDisplay');
    if(timer<=10) td.classList.add('urgent'); else td.classList.remove('urgent');
    if(timer<=0) endGame();
  }, 1000);

  typeInterval = setInterval(()=>{
    currentType = currentType==='vasfi' ? 'ezafi' : 'vasfi';
    updateTaskBox(); renderFlowers();
  }, 5000);
}

function endGame() {
  clearInterval(timerInterval); clearInterval(typeInterval);
  document.getElementById('gameScreen').style.display = 'none';
  const end = document.getElementById('endScreen');
  end.style.display = 'flex';

  let title = '🎉 آفرین! بازی تمام شد! 🎉';
  if(score >= 80) title = '🏆 عالی! تو قهرمانی! 🏆';
  else if(score >= 40) title = '🌟 خوب بود! ادامه بده! 🌟';
  document.getElementById('endTitle').textContent = title;
  document.getElementById('finalScore').textContent = '⭐ ' + score + ' امتیاز';
  document.getElementById('endStats').textContent = `✅ درست: ${correct}  |  ❌ غلط: ${wrong}`;

  if(audioCtx.state==='suspended') audioCtx.resume().then(()=>{ playCheer(); playApplause(); });
  else { playCheer(); playApplause(); }

  startConfetti();
}

function restartGame() {
  stopConfetti();
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('garden').innerHTML = '';
  startGame();
}

let confettiAnim;
function startConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const pieces = Array.from({length:160}, ()=>({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height - canvas.height,
    r: Math.random()*7+4, color:`hsl(${Math.random()*360},95%,65%)`,
    vx:(Math.random()-0.5)*3, vy:Math.random()*3+2, rot:Math.random()*360
  }));
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r); ctx.restore();
      p.x+=p.vx; p.y+=p.vy; p.rot+=3;
      if(p.y>canvas.height){ p.y=-10; p.x=Math.random()*canvas.width; }
    });
    confettiAnim = requestAnimationFrame(draw);
  }
  draw();
}
function stopConfetti() {
  cancelAnimationFrame(confettiAnim);
  document.getElementById('confettiCanvas').getContext('2d')
    .clearRect(0,0,window.innerWidth,window.innerHeight);
}

addClouds();
addBgDecorations();
</script>
